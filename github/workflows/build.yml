name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: |
          unzip -o project.zip -d project
          GR=$(find project -name gradlew | head -n 1)
          echo "PROJECT_DIR=$(dirname "$GR")" >> $GITHUB_ENV
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UraniumTV-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
